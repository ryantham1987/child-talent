function makeSample(){
  let seed=7; const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280;};
  const sm=blank(); sm.name=t("sampleName"); const N=t("sampleNotes");
  const bias={"艺术与创作":1.3,"好奇心":1.2,"语言表达":1,"探索意愿":1,"音乐":.8,"工作记忆":-1.4,"注意与回到任务":-1.2,"自律与日常责任":-.9,"屏幕使用平衡":-1.1,
    "我喜欢的活动":1.3,"好奇与尝试":1.1,"专心与回到任务":-.3,"记住步骤":-.6,"整理与责任":.4,"睡眠与屏幕平衡":-.8};
  ["P","C"].forEach(v=>{DIMS[v].forEach((d,i)=>{sm[v].a[i]=d.q.map(()=>{if(rnd()<.04)return "na";return Math.min(5,Math.max(1,Math.round(3.4+(bias[d.d]||0)+(rnd()-.5)*1.6)));});});sm[v].finished=true;});
  sm.P.n[idx("P","艺术与创作")]=N[0]; sm.P.n[idx("P","工作记忆")]=N[1];
  sm.plan={0:"P|"+idx("P","艺术与创作"),1:"P|"+idx("P","工作记忆"),2:N[2],3:N[3]};
  return sm;
}

/* ---------- render & events ---------- */
const app=document.getElementById("app");
function render(top=true){
  document.documentElement.lang = lang;
  document.title = t("appTitle");
  app.innerHTML = view==="home"?renderHome():view==="quiz"?renderQuiz():renderResults();
  if(top) window.scrollTo({top:0});
}
app.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]"); if(!b) return; const act=b.dataset.act, s=st();
  if(act==="lang"){ lang=b.dataset.l; try{localStorage.setItem(LKEY,lang);}catch(err){} if(sample){const keep=sample.plan;sample=makeSample();} render(false); }
  else if(act==="start"){ sample=null; cur=b.dataset.v; const x=S[cur]; if(isComplete(cur,S)) x.step=0; else { const f=DIMS[cur].findIndex((_,i)=>!dimDone(cur,i,S)); x.step=f<0?0:f; } view="quiz"; save(); render(); }
  else if(act==="home"){ sample=null; view="home"; render(); }
  else if(act==="results"){ sample=null; resTab=b.dataset.v; view="results"; render(); }
  else if(act==="sample"){ sample=makeSample(); resTab="P"; view="results"; render(); }
  else if(act==="exitsample"){ sample=null; view="home"; render(); }
  else if(act==="reset"){ document.getElementById("resetconfirm").innerHTML=`<span class="small"><b>${t("resetQ")}</b></span><button class="btn" data-act="resetyes">${t("resetYes")}</button><button class="btn ghost" data-act="resetno">${t("cancel")}</button>`; }
  else if(act==="resetyes"){ S=blank(); save(); render(); toast(t("cleared")); }
  else if(act==="resetno"){ document.getElementById("resetconfirm").innerHTML=""; }
  else if(act==="ans"){
    const i=s[cur].step, q=+b.dataset.q, val=b.dataset.val==="na"?"na":+b.dataset.val;
    (s[cur].a[i] ||= [])[q]=val; save();
    b.parentElement.querySelectorAll(".opt").forEach(o=>o.setAttribute("aria-checked",String(o===b)));
    const m=DIMS[cur][i].q.length-filled(s[cur].a[i]);
    document.getElementById("hint").textContent = m?t("missing")(m):t("pageDone");
    const bars=categories(cur).map(c=>c.idx.filter(k=>dimDone(cur,k)).length/c.idx.length*100);
    document.querySelectorAll(".trail .bar i").forEach((el,k)=>el.style.width=bars[k]+"%");
  }
  else if(act==="prev"){ if(s[cur].step>0){s[cur].step--;save();render();} }
  else if(act==="next"){
    const i=s[cur].step, a=(s[cur].a[i] ||= []);
    for(let q=0;q<DIMS[cur][i].q.length;q++) if(a[q]===undefined||a[q]===null) a[q]="na";
    if(i<DIMS[cur].length-1){ s[cur].step++; save(); render(); }
    else { s[cur].finished=true; save(); resTab=cur; view="results"; render(); toast(t("finished")(vName(cur))); confetti(); }
  }
  else if(act==="tab"){ resTab=b.dataset.t; render(false); }
  else if(act==="copy"){
    const txt=summaryText();
    const fb=()=>{const ta=document.createElement("textarea");ta.value=txt;ta.style.cssText="position:fixed;opacity:0";document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand("copy");}catch(err){}ta.remove();toast(ok?t("copied"):t("copyFail"));};
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(()=>toast(t("copied")),fb); else fb();
  }
});
app.addEventListener("input",e=>{
  const el=e.target, s=st();
  if(el.id==="childname"){ S.name=el.value; save(); }
  else if(el.id==="note"){ s[cur].n[s[cur].step]=el.value; save(); }
  else if(el.dataset.plan!==undefined && el.tagName==="TEXTAREA"){ s.plan[el.dataset.plan]=el.value; save(); }
});
app.addEventListener("change",e=>{ const el=e.target; if(el.tagName==="SELECT"&&el.dataset.plan!==undefined){ st().plan[el.dataset.plan]=el.value; save(); } });
document.addEventListener("keydown",e=>{
  if(view!=="quiz"||/TEXTAREA|INPUT|SELECT/.test(document.activeElement.tagName)) return;
  if(e.key==="ArrowRight") document.querySelector('[data-act="next"]')?.click();
  if(e.key==="ArrowLeft") document.querySelector('[data-act="prev"]')?.click();
});
render();
</script>
